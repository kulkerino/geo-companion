[project]
name = "geo-companion"
version = "0.1.0"
description = "Offline-first visual geography learning companion."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio<4.11",
  "fastapi==0.115.12",
  "platformdirs>=4.3,<5.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
geo-train = "geo_training.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]
# Running a real exported model in the app (GEO_COMPANION_MODEL=onnx:<manifest>).
model = [
  "numpy>=2.0,<3.0",
  "onnxruntime>=1.20,<2.0",
  "pillow>=11.0,<13.0",
]
# Model training only (Model M1). The app never imports these.
training = [
  "numpy>=2.0,<3.0",
  "onnx>=1.17,<2.0",
  "onnxscript>=0.2,<1.0",
  "onnxruntime>=1.20,<2.0",
  "pillow>=11.0,<13.0",
  "torch>=2.5,<3.0",
]

[tool.uv.sources]
# CPU wheels on Linux (the laptop and CI); CUDA wheels on the Windows RTX machine.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/api/src/geo_companion", "packages/training/src/geo_training"]

[tool.pytest.ini_options]
testpaths = ["packages/api/tests", "packages/training/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/api/src", "packages/training/src"]
