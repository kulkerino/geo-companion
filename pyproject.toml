[project]
name = "geo-companion"
version = "0.1.0"
description = "Offline-first visual geography learning companion."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio<4.11",
  "fastapi==0.115.12",
  "platformdirs>=4.3,<5.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/api/src/geo_companion"]

[tool.pytest.ini_options]
testpaths = ["packages/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/api/src"]
